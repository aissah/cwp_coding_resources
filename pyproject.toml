[project]
name = "cwp_coding_resources"
version = "0.1.0"
description = "template for Center for Wave Phenomena (CWP) codes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dascore>=0.1.3",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.6.8",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79
# enable ruff built in defaults
builtins = ["_"]

[tool.ruff.lint]
# Add rules for linting
extend-select = [
    "D", #pydocstyle
    "N", # pep8-naming
    "I", # isort
    "E", # pycodestyle error
    "F" # Pyflakes rules
]

[tool.ruff.lint.pydocstyle]
# function documentation style
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
